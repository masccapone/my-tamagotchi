<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>경영정보 대시보드</title>
<style>
:root {
  color-scheme: light;
  --surface-0: #f4f4f2;
  --surface-1: #fcfcfb;
  --border: #e2e1dc;
  --text-primary: #0b0b0b;
  --text-secondary: #52514e;
  --text-muted: #85847f;
  --series-1: #2a78d6;
  --series-2: #eb6834;
  --grid: #e8e7e2;
  --warn-bg: #fdf3dc;
  --warn-text: #7a4b00;
  --bad-bg: #fde6e3;
  --bad-text: #8a1f17;
  --ok-bg: #e2f3ea;
  --ok-text: #14553a;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --surface-0: #121211;
    --surface-1: #1a1a19;
    --border: #33322f;
    --text-primary: #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted: #8f8e86;
    --series-1: #3987e5;
    --series-2: #d95926;
    --grid: #2c2b29;
    --warn-bg: #3a2c0c;
    --warn-text: #f3c969;
    --bad-bg: #3d1a17;
    --bad-text: #f3a39b;
    --ok-bg: #12291f;
    --ok-text: #86d8b0;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--surface-0);
  color: var(--text-primary);
  font: 15px/1.5 -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
}
.wrap { max-width: 1080px; margin: 0 auto; padding: 24px 16px 64px; }
h1 { font-size: 22px; margin: 0 0 4px; }
h2 { font-size: 17px; margin: 32px 0 12px; }
p.sub { margin: 0; color: var(--text-secondary); }
.card {
  background: var(--surface-1);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 16px;
}
.drop {
  margin-top: 16px;
  border: 1.5px dashed var(--border);
  border-radius: 12px;
  padding: 20px;
  text-align: center;
  background: var(--surface-1);
  color: var(--text-secondary);
}
.drop.over { border-color: var(--series-1); }
.drop button, .btn {
  font: inherit;
  background: var(--series-1);
  color: #fff;
  border: 0;
  border-radius: 8px;
  padding: 8px 16px;
  cursor: pointer;
}
.btn.ghost { background: transparent; color: var(--text-secondary); border: 1px solid var(--border); padding: 4px 10px; font-size: 13px; }
.files { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; justify-content: center; }
.chip { font-size: 13px; padding: 2px 10px; border-radius: 999px; border: 1px solid var(--border); color: var(--text-muted); }
.chip.on { color: var(--ok-text); background: var(--ok-bg); border-color: transparent; }
.privacy { margin-top: 10px; font-size: 13px; color: var(--text-muted); }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; }
.tile .label { font-size: 13px; color: var(--text-secondary); }
.tile .value { font-size: 28px; font-weight: 600; margin: 2px 0; font-variant-numeric: tabular-nums; }
.tile .note { font-size: 12px; color: var(--text-muted); }
.row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 12px; }
select { font: inherit; background: var(--surface-1); color: var(--text-primary); border: 1px solid var(--border); border-radius: 6px; padding: 4px 8px; }
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13.5px; font-variant-numeric: tabular-nums; }
th, td { padding: 7px 10px; border-bottom: 1px solid var(--border); text-align: right; white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }
th { color: var(--text-secondary); font-weight: 500; }
.badge { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 999px; margin-left: 4px; }
.badge.warn { background: var(--warn-bg); color: var(--warn-text); }
.badge.bad { background: var(--bad-bg); color: var(--bad-text); }
.callout { border-radius: 10px; padding: 12px 14px; margin: 12px 0; font-size: 14px; }
.callout.warn { background: var(--warn-bg); color: var(--warn-text); }
.callout.bad { background: var(--bad-bg); color: var(--bad-text); }
.callout.ok { background: var(--ok-bg); color: var(--ok-text); }
.callout ul { margin: 4px 0 0; padding-left: 18px; }
.chartbox { position: relative; height: 280px; }
.legend { display: flex; gap: 16px; font-size: 13px; color: var(--text-secondary); margin-bottom: 8px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; }
.hidden { display: none; }
.num-neg { color: var(--bad-text); }
@media (max-width: 600px) { .tile .value { font-size: 24px; } }
</style>
</head>
<body>
<div class="wrap">
  <h1>경영정보 대시보드</h1>
  <p class="sub">WEHAGO 보고서 엑셀을 올리면 손익·손익분기(BEP)·톤당 수익성을 계산합니다.</p>

  <div class="drop" id="drop">
    <div>엑셀 파일을 여기에 끌어놓거나</div>
    <p style="margin:10px 0 0"><button id="pick">파일 선택</button></p>
    <input type="file" id="file" accept=".xlsx,.xls" multiple class="hidden">
    <div class="files">
      <span class="chip" id="chip-pl">손익계산서</span>
      <span class="chip" id="chip-cs">제조원가명세서</span>
      <span class="chip" id="chip-lg">반입 대장(톤수, 선택)</span>
    </div>
    <div class="privacy">파일은 이 브라우저 안에서만 처리되며 서버로 전송되거나 저장되지 않습니다. (고정비/변동비 분류 설정만 이 브라우저에 저장됩니다.)</div>
  </div>

  <div id="msg"></div>
  <div id="app" class="hidden">
    <h2>기간</h2>
    <div class="row">
      <select id="from"></select> ~ <select id="to"></select>
      <span class="badge" style="color:var(--text-muted)" id="periodnote"></span>
    </div>

    <div id="checks"></div>

    <div class="tiles" id="tiles"></div>

    <h2>월별 매출과 발생비용</h2>
    <div class="card">
      <div class="legend"><span><i style="background:var(--series-1)"></i>매출</span><span><i style="background:var(--series-2)"></i>발생비용</span></div>
      <div class="chartbox"><canvas id="chart" role="img" aria-label="월별 매출과 발생비용 막대 차트"></canvas></div>
    </div>

    <h2>월별 표</h2>
    <div class="card tablewrap"><table id="monthly"></table></div>

    <h2>손익분기(BEP)</h2>
    <div id="bep"></div>
    <div class="card tablewrap" style="margin-top:12px">
      <div class="row">
        <label><input type="checkbox" id="incl-nonop" checked> 영업외비용(이자 등) 포함</label>
        <button class="btn ghost" id="reset-class">분류 초기화</button>
      </div>
      <table id="classtable"></table>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script>
(function () {
  'use strict';

  // ---------- 상태 ----------
  var state = { pl: null, cs: null, lg: null };
  var chart = null;
  var CLASS_KEY = 'bep-class-v1';

  function loadClass() {
    try { return JSON.parse(localStorage.getItem(CLASS_KEY)) || {}; } catch (e) { return {}; }
  }
  function saveClass(c) {
    try { localStorage.setItem(CLASS_KEY, JSON.stringify(c)); } catch (e) { /* 저장 불가여도 동작 */ }
  }
  var classOverride = loadClass();

  // ---------- 유틸 ----------
  function $(id) { return document.getElementById(id); }
  function esc(s) { var d = document.createElement('div'); d.textContent = String(s); return d.innerHTML; }
  function num(x) { return typeof x === 'number' && isFinite(x) ? x : 0; }
  function sum(a) { return a.reduce(function (s, x) { return s + x; }, 0); }
  function mil(x) { return Math.round(x / 1e6).toLocaleString('ko-KR'); }       // 백만원
  function eok(x) { return (x / 1e8).toLocaleString('ko-KR', { maximumFractionDigits: 1, minimumFractionDigits: 1 }); }
  function signed(cls, text) { return cls < 0 ? '<span class="num-neg">' + text + '</span>' : text; }
  function cssVar(n) { return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }

  // ---------- 보고서 파싱 ----------
  var ROMAN = /^[Ⅰ-ⅿ]+\.\s*(.*)$/;

  function parseStatement(ws) {
    var rows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: null });
    var h = -1;
    for (var i = 0; i < Math.min(rows.length, 10); i++) {
      var c0 = String(rows[i][0] || '').replace(/\s/g, '');
      if (c0 === '과목') { h = i; break; }
    }
    if (h < 0) return null;
    var months = [];
    rows[h].forEach(function (c, idx) {
      var m = /(\d{4})\s*년\s*(\d{1,2})\s*월/.exec(String(c || ''));
      if (m) months.push({ idx: idx, key: m[1] + '-' + ('0' + m[2]).slice(-2) });
    });
    if (!months.length) return null;
    var out = [], group = '';
    for (var r = h + 1; r < rows.length; r++) {
      var label = String(rows[r][0] || '').trim();
      if (!label) continue;
      var rm = ROMAN.exec(label);
      var vals = {};
      months.forEach(function (mo) { vals[mo.key] = num(rows[r][mo.idx]); });
      if (rm) { group = rm[1].trim(); out.push({ header: true, name: group, group: group, vals: vals }); }
      else out.push({ header: false, name: label, group: group, vals: vals });
    }
    return { months: months.map(function (m) { return m.key; }), rows: out };
  }

  function findHeader(st, text) {
    for (var i = 0; i < st.rows.length; i++) {
      if (st.rows[i].header && st.rows[i].name.replace(/\s/g, '').indexOf(text) >= 0) return st.rows[i];
    }
    return null;
  }

  function parseLedger(wb) {
    var ws = wb.Sheets['처리인계서(반입)'];
    if (!ws) return null;
    var rows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: null });
    var h = -1, cd = -1, cq = -1;
    for (var i = 0; i < Math.min(rows.length, 10); i++) {
      var d = rows[i].indexOf('일자'), q = rows[i].indexOf('위탁량');
      if (d >= 0 && q >= 0) { h = i; cd = d; cq = q; break; }
    }
    if (h < 0) return null;
    var tons = {}, count = {};
    for (var r = h + 1; r < rows.length; r++) {
      var dv = rows[r][cd], qv = rows[r][cq], dt = null;
      if (dv instanceof Date) dt = dv;
      else if (typeof dv === 'number' && dv > 20000) dt = new Date(Math.round((dv - 25569) * 86400000));
      if (!dt || typeof qv !== 'number' || qv <= 0) continue;
      var key = dt.getUTCFullYear() + '-' + ('0' + (dt.getUTCMonth() + 1)).slice(-2);
      tons[key] = (tons[key] || 0) + qv / 1000;   // kg -> ton
      count[key] = (count[key] || 0) + 1;
    }
    return { tons: tons, count: count };
  }

  function readFile(file) {
    return file.arrayBuffer().then(function (buf) {
      var wb = XLSX.read(buf, { type: 'array', cellDates: true });
      var lg = parseLedger(wb);
      if (lg) { state.lg = lg; return 'lg'; }
      var st = parseStatement(wb.Sheets[wb.SheetNames[0]]);
      if (!st) return null;
      if (findHeader(st, '매출액')) { state.pl = st; return 'pl'; }
      if (findHeader(st, '노무비') || findHeader(st, '공사원가')) { state.cs = st; return 'cs'; }
      return null;
    });
  }

  function handleFiles(files) {
    var list = Array.prototype.slice.call(files);
    Promise.all(list.map(function (f) {
      return readFile(f).then(function (k) { return { name: f.name, kind: k }; }, function () { return { name: f.name, kind: null }; });
    })).then(function (res) {
      var bad = res.filter(function (r) { return !r.kind; });
      $('msg').innerHTML = bad.length
        ? '<div class="callout warn">읽지 못한 파일: ' + bad.map(function (b) { return esc(b.name); }).join(', ') +
          '<br>손익계산서, 제조원가명세서(월별), 반입 대장 형식만 지원합니다.</div>'
        : '';
      $('chip-pl').classList.toggle('on', !!state.pl);
      $('chip-cs').classList.toggle('on', !!state.cs);
      $('chip-lg').classList.toggle('on', !!state.lg);
      build();
    });
  }

  // ---------- 모델 ----------
  var VAR_RE = /운반비|전력비|지급수수료|수선비|소모품비|차량유지비|수도광열비|외주|원재료|충당부채전입/;
  function defaultClass(name) { return VAR_RE.test(name) ? 'var' : 'fix'; }

  var model = null;

  function build() {
    if (!state.pl) { $('app').classList.add('hidden'); if (state.cs || state.lg) $('msg').insertAdjacentHTML('beforeend', '<div class="callout warn">손익계산서가 있어야 분석을 시작할 수 있습니다.</div>'); return; }
    var pl = state.pl, cs = state.cs;
    var keys = pl.months.slice();
    if (cs) cs.months.forEach(function (k) { if (keys.indexOf(k) < 0) keys.push(k); });
    keys.sort();

    function hv(st, text, k) { var r = st && findHeader(st, text); return r ? num(r.vals[k]) : 0; }

    var items = [];
    function addItems(st, src, groups) {
      if (!st) return;
      st.rows.forEach(function (r) {
        if (r.header || groups.indexOf(r.group.replace(/\s/g, '')) < 0) return;
        items.push({ id: src + '|' + r.name, src: src, name: r.name, vals: r.vals });
      });
    }
    addItems(cs, '제조', ['공사원재료비', '노무비', '외주비', '경비']);
    addItems(pl, '판관', ['판매비와관리비']);
    addItems(pl, '영업외', ['영업외비용']);

    var months = keys.map(function (k) {
      var rev = hv(pl, '매출액', k), cogs = hv(pl, '매출원가', k), sga = hv(pl, '판매비와관리비', k);
      var ni = hv(pl, '영업외수익', k), nc = hv(pl, '영업외비용', k);
      var incurred = sum(items.map(function (it) { return num(it.vals[k]); }));
      return {
        key: k, rev: rev, cogs: cogs, sga: sga, nonopInc: ni, nonopCost: nc,
        plProfit: rev - cogs - sga + ni - nc,
        incurred: incurred,
        tons: state.lg ? (state.lg.tons[k] || 0) : 0,
        hasCS: !!(cs && cs.months.indexOf(k) >= 0)
      };
    });
    months = months.filter(function (m) { return m.rev !== 0 || m.incurred !== 0 || m.cogs !== 0; });

    // 월별 신뢰도 점검
    var revs = months.map(function (m) { return m.rev; }).filter(function (x) { return x > 0; }).sort(function (a, b) { return a - b; });
    var med = revs.length ? revs[Math.floor(revs.length / 2)] : 0;
    months.forEach(function (m) {
      m.flags = [];
      if (m.rev > 0 && m.cogs === 0) m.flags.push({ t: '원가 미반영', c: 'warn' });
      if (m.rev > 0 && med > 0 && m.rev < med * 0.3) m.flags.push({ t: '매출 급감(마감 확인)', c: 'warn' });
    });

    model = { months: months, items: items };
    var sel = months.map(function (m, i) { return '<option value="' + i + '">' + esc(m.key.replace('-', '년 ') + '월') + '</option>'; }).join('');
    $('from').innerHTML = sel; $('to').innerHTML = sel;
    $('from').value = 0; $('to').value = months.length - 1;
    $('app').classList.remove('hidden');
    render();
  }

  // ---------- 렌더 ----------
  function periodMonths() {
    var a = +$('from').value, b = +$('to').value;
    if (a > b) { var t = a; a = b; b = t; }
    return model.months.slice(a, b + 1);
  }

  function render() {
    if (!model) return;
    var pm = periodMonths();
    var keys = pm.map(function (m) { return m.key; });
    $('periodnote').textContent = pm.length + '개월';

    var R = sum(pm.map(function (m) { return m.rev; }));
    var C = sum(pm.map(function (m) { return m.incurred; }));
    var P = sum(pm.map(function (m) { return m.plProfit; }));
    var gap = (R - C) - P;
    var hasCS = !!state.cs;

    // 점검 메시지
    var checks = [];
    pm.forEach(function (m) { m.flags.forEach(function (f) { checks.push(m.key.replace('-', '년 ') + '월: ' + f.t); }); });
    var html = '';
    if (!hasCS) html += '<div class="callout warn">제조원가명세서가 없어 발생비용에는 판관비와 영업외비용만 포함됩니다.</div>';
    if (checks.length) {
      html += '<div class="callout warn"><b>손익계산서 월별 숫자는 그대로 믿기 어렵습니다.</b> 아래 달은 원가가 반영되지 않았거나 마감이 덜 된 것으로 보입니다. 월별 손익 대신 <b>누적 기간</b> 또는 <b>발생비용 기준</b>으로 판단하세요.<ul>' +
        checks.map(function (c) { return '<li>' + esc(c) + '</li>'; }).join('') + '</ul></div>';
    }
    if (hasCS && Math.abs(gap) > 0.02 * Math.max(R, 1)) {
      html += '<div class="callout warn">발생비용 기준 손익과 손익계산서 손익이 <b>' + eok(Math.abs(gap)) + '억원</b> 차이납니다. ' +
        (gap < 0 ? '손익계산서의 원가가 발생비용보다 작게 잡혀 있어(재고·미완성 등으로 이연된 금액이 있을 수 있음) 실제 손실이 손익계산서보다 클 수 있습니다.' : '손익계산서의 원가가 발생비용보다 크게 잡혀 있습니다.') +
        ' 회계 담당자 확인이 필요합니다.</div>';
    }
    $('checks').innerHTML = html;

    // 타일
    var tilesHtml = [
      ['매출', eok(R) + '억', pm.length + '개월 합계'],
      ['발생비용', eok(C) + '억', '제조원가 + 판관비 + 영업외비용'],
      ['손익 (발생비용 기준)', signed(R - C, eok(R - C) + '억'), '매출 − 발생비용'],
      ['손익 (손익계산서)', signed(P, eok(P) + '억'), '월별 반영 시점 차이로 달라질 수 있음']
    ].map(function (t) {
      return '<div class="card tile"><div class="label">' + t[0] + '</div><div class="value">' + t[1] + '</div><div class="note">' + t[2] + '</div></div>';
    }).join('');
    $('tiles').innerHTML = tilesHtml;

    // 월별 표
    var hasTons = !!state.lg;
    var th = '<tr><th>월</th><th>매출</th><th>매출원가</th><th>발생비용</th><th>손익(발생)</th><th>손익(계산서)</th>' +
      (hasTons ? '<th>반입(톤)</th><th>톤당 매출(원)</th><th>톤당 발생비용(원)</th>' : '') + '<th>점검</th></tr>';
    var body = pm.map(function (m) {
      var perR = m.tons > 0 ? Math.round(m.rev / m.tons).toLocaleString('ko-KR') : '-';
      var perC = m.tons > 0 ? Math.round(m.incurred / m.tons).toLocaleString('ko-KR') : '-';
      return '<tr><td>' + esc(m.key) + '</td><td>' + mil(m.rev) + '</td><td>' + mil(m.cogs) + '</td><td>' + mil(m.incurred) +
        '</td><td>' + signed(m.rev - m.incurred, mil(m.rev - m.incurred)) + '</td><td>' + signed(m.plProfit, mil(m.plProfit)) + '</td>' +
        (hasTons ? '<td>' + (m.tons ? Math.round(m.tons).toLocaleString('ko-KR') : '-') + '</td><td>' + perR + '</td><td>' + perC + '</td>' : '') +
        '<td style="text-align:left">' + (m.flags.map(function (f) { return '<span class="badge ' + f.c + '">' + esc(f.t) + '</span>'; }).join('') || '') + '</td></tr>';
    }).join('');
    $('monthly').innerHTML = '<caption style="text-align:left;color:var(--text-muted);font-size:12px;padding-bottom:6px">금액 단위: 백만원</caption>' + th + body;

    drawChart(pm);
    renderBep(pm, R);
  }

  function drawChart(pm) {
    var ctx = $('chart').getContext('2d');
    if (chart) chart.destroy();
    var grid = cssVar('--grid'), txt = cssVar('--text-secondary');
    chart = new Chart(ctx, {
      type: 'bar',
      data: {
        labels: pm.map(function (m) { return m.key.slice(5) + '월'; }),
        datasets: [
          { label: '매출', data: pm.map(function (m) { return Math.round(m.rev / 1e6); }), backgroundColor: cssVar('--series-1'), borderRadius: 4, maxBarThickness: 28 },
          { label: '발생비용', data: pm.map(function (m) { return Math.round(m.incurred / 1e6); }), backgroundColor: cssVar('--series-2'), borderRadius: 4, maxBarThickness: 28 }
        ]
      },
      options: {
        responsive: true, maintainAspectRatio: false, animation: false,
        plugins: {
          legend: { display: false },
          tooltip: { callbacks: { label: function (c) { return c.dataset.label + ': ' + c.parsed.y.toLocaleString('ko-KR') + '백만원'; } } }
        },
        scales: {
          x: { grid: { display: false }, ticks: { color: txt } },
          y: { grid: { color: grid }, ticks: { color: txt, callback: function (v) { return v.toLocaleString('ko-KR'); } }, title: { display: true, text: '백만원', color: txt } }
        }
      }
    });
  }

  function classOf(it) { return classOverride[it.id] || defaultClass(it.name); }

  function renderBep(pm, R) {
    var keys = pm.map(function (m) { return m.key; });
    var inclNonop = $('incl-nonop').checked;
    var rows = model.items.map(function (it) {
      return { it: it, amt: sum(keys.map(function (k) { return num(it.vals[k]); })), cls: classOf(it) };
    }).filter(function (r) { return r.amt !== 0 && (inclNonop || r.it.src !== '영업외'); });
    rows.sort(function (a, b) { return Math.abs(b.amt) - Math.abs(a.amt); });

    var F = sum(rows.filter(function (r) { return r.cls === 'fix'; }).map(function (r) { return r.amt; }));
    var V = sum(rows.filter(function (r) { return r.cls === 'var'; }).map(function (r) { return r.amt; }));
    var CM = R - V, cmr = R > 0 ? CM / R : 0, n = pm.length;
    var out = '';

    if (R <= 0) {
      out = '<div class="callout warn">선택 기간에 매출이 없어 계산할 수 없습니다.</div>';
    } else if (cmr < 0.05) {
      out = '<div class="callout bad"><b>이 분류에서는 의미 있는 손익분기점을 계산할 수 없습니다.</b> 변동비(' + eok(V) + '억)가 매출(' + eok(R) + '억)의 ' + (V / R * 100).toFixed(0) + '%라 ' +
        '공헌이익률이 ' + (cmr * 100).toFixed(1) + '%입니다. 매출을 늘려도 비용이 같이 늘어나는 구조로 계산됩니다. ' +
        '아래 표에서 변동비로 분류한 항목이 실제로 매출(처리량)에 비례하는 비용인지 확인하세요. 현재 분류는 이름으로 추정한 초안입니다.</div>';
    } else {
      var bepRev = F / cmr, ach = R / bepRev;
      out = '<div class="tiles">' +
        tile('고정비', eok(F) + '억', '월 평균 ' + eok(F / n) + '억') +
        tile('변동비', eok(V) + '억', '매출의 ' + (V / R * 100).toFixed(0) + '%') +
        tile('공헌이익률', (cmr * 100).toFixed(1) + '%', '(매출 − 변동비) ÷ 매출') +
        tile('손익분기 매출', eok(bepRev) + '억', '월 평균 ' + eok(bepRev / n) + '억 · 현재 달성률 ' + (ach * 100).toFixed(0) + '%') +
        '</div>';
      if (ach >= 1) out += '<div class="callout ok">선택 기간 매출이 손익분기를 넘었습니다.</div>';
    }

    // 톤당 분석
    var tm = pm.filter(function (m) { return m.tons > 0 && m.rev > 0; });
    if (state.lg && tm.length && R > 0) {
      var tk = tm.map(function (m) { return m.key; });
      var T = sum(tm.map(function (m) { return m.tons; })), Rt = sum(tm.map(function (m) { return m.rev; }));
      var Vt = sum(rows.filter(function (r) { return r.cls === 'var'; }).map(function (r) { return sum(tk.map(function (k) { return num(r.it.vals[k]); })); }));
      var Ft = sum(rows.filter(function (r) { return r.cls === 'fix'; }).map(function (r) { return sum(tk.map(function (k) { return num(r.it.vals[k]); })); }));
      var unit = (Rt - Vt) / T;
      var thin = unit <= 0.05 * (Rt / T);
      var s = '<div class="callout ' + (thin ? 'bad' : 'ok') + '"><b>톤당 분석</b> (반입량이 있는 ' + tm.length + '개월 기준)<ul>' +
        '<li>톤당 매출 ' + Math.round(Rt / T).toLocaleString('ko-KR') + '원, 톤당 변동비 ' + Math.round(Vt / T).toLocaleString('ko-KR') + '원 → 톤당 공헌이익 ' + Math.round(unit).toLocaleString('ko-KR') + '원</li>';
      if (!thin) s += '<li>월 고정비 ' + mil(Ft / tm.length) + '백만원을 덮으려면 월 약 <b>' + Math.round((Ft / tm.length) / unit).toLocaleString('ko-KR') + '톤</b> 반입이 필요합니다 (현재 월 평균 ' + Math.round(T / tm.length).toLocaleString('ko-KR') + '톤).</li>';
      else s += '<li>톤당 공헌이익이 톤당 매출의 5% 미만이라 반입량을 늘려도 고정비를 회수하기 어렵습니다(손익분기 톤수 계산 생략).</li>';
      s += '</ul></div>';
      out += s;
    }
    $('bep').innerHTML = out;

    // 분류 표
    var th = '<tr><th>항목</th><th>구분</th><th>기간 합계(백만원)</th><th>분류</th></tr>';
    var srcName = { '제조': '제조원가', '판관': '판관비', '영업외': '영업외비용' };
    $('classtable').innerHTML = th + rows.map(function (r, i) {
      return '<tr><td>' + esc(r.it.name) + '</td><td>' + srcName[r.it.src] + '</td><td>' + mil(r.amt) + '</td><td>' +
        '<select data-i="' + i + '"><option value="fix"' + (r.cls === 'fix' ? ' selected' : '') + '>고정비</option><option value="var"' + (r.cls === 'var' ? ' selected' : '') + '>변동비</option></select></td></tr>';
    }).join('');
    Array.prototype.forEach.call($('classtable').querySelectorAll('select'), function (sel) {
      sel.addEventListener('change', function () {
        classOverride[rows[+sel.dataset.i].it.id] = sel.value;
        saveClass(classOverride);
        render();
      });
    });
  }

  function tile(l, v, n) {
    return '<div class="card tile"><div class="label">' + l + '</div><div class="value">' + v + '</div><div class="note">' + n + '</div></div>';
  }

  // ---------- 이벤트 ----------
  $('pick').addEventListener('click', function () { $('file').click(); });
  $('file').addEventListener('change', function (e) { handleFiles(e.target.files); e.target.value = ''; });
  $('from').addEventListener('change', render);
  $('to').addEventListener('change', render);
  $('incl-nonop').addEventListener('change', render);
  $('reset-class').addEventListener('click', function () { classOverride = {}; saveClass(classOverride); render(); });
  var drop = $('drop');
  ['dragenter', 'dragover'].forEach(function (ev) { drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.add('over'); }); });
  ['dragleave', 'drop'].forEach(function (ev) { drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.remove('over'); }); });
  drop.addEventListener('drop', function (e) { handleFiles(e.dataTransfer.files); });
  if (window.matchMedia) window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function () { if (model) render(); });
})();
</script>
</body>
</html>
