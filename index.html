<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>경영정보 질문 도구</title>
<link rel="icon" href="data:,">
<style>
:root {
  color-scheme: light;
  --surface-0: #f4f4f2;
  --surface-1: #fcfcfb;
  --border: #e2e1dc;
  --text-primary: #0b0b0b;
  --text-secondary: #52514e;
  --text-muted: #85847f;
  --series-1: #2a78d6;
  --series-2: #eb6834;
  --grid: #e8e7e2;
  --warn-bg: #fdf3dc;
  --warn-text: #7a4b00;
  --bad-bg: #fde6e3;
  --bad-text: #8a1f17;
  --ok-bg: #e2f3ea;
  --ok-text: #14553a;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --surface-0: #121211;
    --surface-1: #1a1a19;
    --border: #33322f;
    --text-primary: #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted: #8f8e86;
    --series-1: #3987e5;
    --series-2: #d95926;
    --grid: #2c2b29;
    --warn-bg: #3a2c0c;
    --warn-text: #f3c969;
    --bad-bg: #3d1a17;
    --bad-text: #f3a39b;
    --ok-bg: #12291f;
    --ok-text: #86d8b0;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--surface-0);
  color: var(--text-primary);
  font: 15px/1.55 -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
}
.wrap { max-width: 1000px; margin: 0 auto; padding: 24px 16px 72px; }
h1 { font-size: 22px; margin: 0 0 4px; }
h2 { font-size: 17px; margin: 32px 0 12px; }
h4 { font-size: 14px; margin: 18px 0 6px; color: var(--text-secondary); }
p.sub { margin: 0; color: var(--text-secondary); }
.hidden { display: none; }
.card { background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
.drop { margin-top: 16px; border: 1.5px dashed var(--border); border-radius: 12px; padding: 20px; text-align: center; background: var(--surface-1); color: var(--text-secondary); }
.drop.over { border-color: var(--series-1); }
button, .btn { font: inherit; background: var(--series-1); color: #fff; border: 0; border-radius: 8px; padding: 8px 16px; cursor: pointer; }
button.ghost { background: transparent; color: var(--text-secondary); border: 1px solid var(--border); padding: 4px 10px; font-size: 13px; }
button.small { padding: 4px 12px; font-size: 13px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; justify-content: center; }
.chip { font-size: 13px; padding: 2px 10px; border-radius: 999px; border: 1px solid var(--border); color: var(--text-muted); }
.chip.on { color: var(--ok-text); background: var(--ok-bg); border-color: transparent; }
.chip small { opacity: .8; }
.file { font-size: 12px; color: var(--text-muted); margin: 0 6px; }
.privacy { margin-top: 10px; font-size: 13px; color: var(--text-muted); }
.links { margin-top: 8px; font-size: 13px; }
.links a { color: var(--series-1); margin: 0 6px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; margin: 12px 0; }
.tile .label { font-size: 13px; color: var(--text-secondary); }
.tile .value { font-size: 26px; font-weight: 600; margin: 2px 0; font-variant-numeric: tabular-nums; }
.tile .note { font-size: 12px; color: var(--text-muted); }
.asof { color: var(--text-secondary); font-size: 14px; margin-top: 20px; }
.callout { border-radius: 10px; padding: 12px 14px; margin: 12px 0; font-size: 14px; }
.callout.warn { background: var(--warn-bg); color: var(--warn-text); }
.callout.bad { background: var(--bad-bg); color: var(--bad-text); }
.callout.ok { background: var(--ok-bg); color: var(--ok-text); }
ul.wl { margin: 6px 0 0; padding-left: 18px; }
ul.wl li.bad { color: var(--bad-text); }
.qlist { display: flex; flex-wrap: wrap; gap: 8px; }
.qchip { background: var(--surface-1); color: var(--text-primary); border: 1px solid var(--border); border-radius: 999px; padding: 8px 14px; font-size: 14px; text-align: left; }
.qchip:hover { border-color: var(--series-1); }
.qchip.on { background: var(--series-1); color: #fff; border-color: var(--series-1); }
.params { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; margin: 14px 0 4px; font-size: 14px; }
.params label, .row label { color: var(--text-secondary); }
input, select { font: inherit; background: var(--surface-1); color: var(--text-primary); border: 1px solid var(--border); border-radius: 6px; padding: 5px 8px; max-width: 100%; }
.row { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; margin: 10px 0; }
.ans { margin-top: 12px; }
.headline { font-size: 18px; font-weight: 600; line-height: 1.5; margin-bottom: 6px; }
.hint { color: var(--text-muted); margin-top: 12px; }
ul.notes { margin: 14px 0 0; padding-left: 18px; color: var(--text-muted); font-size: 13px; }
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13.5px; font-variant-numeric: tabular-nums; }
th, td { padding: 7px 10px; border-bottom: 1px solid var(--border); text-align: left; vertical-align: top; }
th { color: var(--text-secondary); font-weight: 500; white-space: nowrap; }
td.r, th.r { text-align: right; white-space: nowrap; }
.badge { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 999px; margin-right: 4px; }
.badge.warn { background: var(--warn-bg); color: var(--warn-text); }
.badge.bad { background: var(--bad-bg); color: var(--bad-text); }
.neg { color: var(--bad-text); }
.estbox { margin: 8px 0 0; font-size: 14px; color: var(--text-secondary); }
.estbox details { margin-top: 4px; }
.estbox details summary { margin: 0; font-weight: 400; font-size: 13px; color: var(--text-muted); }
.estbox details div { margin-top: 4px; font-size: 13px; }
.meta { font-size: 13px; color: var(--text-secondary); margin-bottom: 8px; }
.metanote { margin-top: 4px; color: var(--text-muted); }
.metawarn { margin-top: 4px; color: var(--bad-text); }
.st { display: inline-block; font-size: 12px; font-weight: 600; padding: 1px 8px; border-radius: 999px; margin-right: 6px; }
.st.fixed { background: var(--ok-bg); color: var(--ok-text); }
.st.prov { background: var(--warn-bg); color: var(--warn-text); }
.st.est { background: var(--bad-bg); color: var(--bad-text); }
.userbar { display: flex; justify-content: flex-end; align-items: center; gap: 10px; font-size: 13px; color: var(--text-muted); margin-top: 4px; }
.login { max-width: 360px; margin: 24px auto; }
.login label { display: block; margin-bottom: 12px; color: var(--text-secondary); }
.login input { width: 100%; margin-top: 4px; }
.askform { display: flex; gap: 8px; margin-bottom: 8px; }
.askform input { flex: 1; min-width: 0; padding: 10px 12px; font-size: 15px; }
.understood { font-size: 13px; color: var(--text-secondary); margin: 6px 0 10px; min-height: 1em; }
.file .x { background: transparent; color: var(--text-muted); border: 0; padding: 0 4px; font-size: 14px; cursor: pointer; }
.qchip.off { opacity: .55; cursor: not-allowed; }
.qchip small { color: var(--text-muted); }
.chartbox { position: relative; height: 260px; }
.legend { display: flex; gap: 16px; font-size: 13px; color: var(--text-secondary); margin-bottom: 8px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; }
details summary { cursor: pointer; font-weight: 600; margin: 28px 0 12px; }
@media (max-width: 600px) { .tile .value { font-size: 22px; } .headline { font-size: 16px; } }
</style>
</head>
<body>
<div class="wrap">
  <h1>경영정보 질문 도구</h1>
  <p class="sub">ERP 분개장과 거래내역 엑셀을 올리면, 자주 묻는 경영 질문에 한 줄 답과 근거를 보여줍니다.</p>
  <div id="userbar" class="userbar hidden"><span id="who"></span><button class="ghost" id="logout">로그아웃</button></div>

  <div id="login" class="card login hidden">
    <form id="loginform">
      <h2 style="margin-top:0">로그인</h2>
      <label>비밀번호 <input id="loginpw" type="password" autocomplete="current-password"></label>
      <button type="submit">로그인</button>
      <div id="loginerr" class="neg" role="alert"></div>
    </form>
  </div>

  <div class="drop hidden" id="drop">
    <div>엑셀 파일을 여기에 끌어놓거나</div>
    <p style="margin:10px 0 0"><button id="pick">파일 선택</button> <button class="ghost" id="reset">모두 지우기</button></p>
    <input type="file" id="file" accept=".xlsx,.xls" multiple class="hidden">
    <div class="chips">
      <span class="chip" id="chip-j">분개장</span>
      <span class="chip" id="chip-t">거래내역 또는 반입/반출 현황 <small>(선택)</small></span>
      <span class="chip" id="chip-v">업체마스터 <small>(선택)</small></span>
    </div>
    <div id="loaded" style="margin-top:8px"></div>
    <div class="links">템플릿 받기:
      <a href="templates/%EA%B1%B0%EB%9E%98%EB%82%B4%EC%97%AD_%ED%85%9C%ED%94%8C%EB%A6%BF.xlsx">거래내역(업체마스터 포함)</a>
      <a href="templates/%EC%97%85%EC%B2%B4%EB%A7%88%EC%8A%A4%ED%84%B0_%ED%85%9C%ED%94%8C%EB%A6%BF.xlsx">업체마스터</a>
    </div>
    <div class="privacy">파일은 이 브라우저 안에서만 처리되며 서버로 전송되거나 저장되지 않습니다. (통장 기준 잔액 입력값만 이 브라우저에 저장됩니다.)</div>
  </div>

  <div id="msg"></div>
  <div id="serverinfo"></div>
  <div id="savebar" class="callout warn hidden">저장하지 않은 변경이 있습니다. <button id="savebtn" class="small">서버에 저장</button> <span id="saveerr" class="neg"></span></div>

  <div id="app" class="hidden">
    <div id="summary"></div>

    <h2>무엇이 궁금하세요?</h2>
    <form id="askform" class="askform"><input id="askq" type="text" placeholder="예: ○○환경 이번 달 줄 돈 얼마야?" autocomplete="off" aria-label="질문 입력"><button type="submit">질문하기</button></form>
    <div id="understood" class="understood" aria-live="polite"></div>
    <div class="qlist" id="qlist"></div>
    <div class="params" id="params"></div>
    <div id="answer"></div>

    <details open>
      <summary>월별 추이</summary>
      <div class="card">
        <div class="legend"><span><i style="background:var(--series-1)"></i>매출</span><span><i style="background:var(--series-2)"></i>발생비용</span><span><i style="background:var(--series-2);opacity:.45"></i>결산 예상 추가(추정)</span></div>
        <div class="chartbox"><canvas id="chart" role="img" aria-label="월별 매출과 발생비용 막대 차트"></canvas></div>
        <div id="trendtbl" style="margin-top:12px"></div>
      </div>
    </details>
  </div>
</div>

<script src="vendor/xlsx.full.min.js"></script>
<script src="vendor/chart.umd.js"></script>
<script src="js/util.js"></script>
<script src="js/adapters.js"></script>
<script src="js/model.js"></script>
<script src="js/analysis.js"></script>
<script src="js/questions.js"></script>
<script src="js/nl.js"></script>
<script src="js/engine.js"></script>
<script src="js/app.js"></script>
</body>
</html>
